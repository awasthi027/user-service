# ── Test datasource: H2 in-memory, no Flyway ─────────────────────────────────
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.flyway.enabled=false

# JWT – short expiry so we can test token expiry quickly
jwt.secret=dGVzdC1zZWNyZXQtZm9yLXVuaXQtdGVzdGluZy1vbmx5LW11c3QtYmUtMjU2LWJpdHM=
jwt.expiration-ms=900000
jwt.refresh-expiration-ms=604800000
jwt.issuer=user-service
jwt.audience=api-gateway

