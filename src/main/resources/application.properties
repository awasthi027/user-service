# ─────────────────────────────────────────────────────────────────────────────
# PostgreSQL – Railway uses individual PG* env vars.
# For local dev, override via your own .env or IDE run-configuration.
# ─────────────────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:userservice}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ─────────────────────────────────────────────────────────────────────────────
# JWT
# jwt.secret  MUST be a Base64-encoded key of >= 256 bits (32 bytes).
# Set JWT_SECRET in Railway env vars to a strong random value.
# ─────────────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:bXlzdXBlcnNlY3JldGtleWZvcnVzZXJzZXJ2aWNlMTIzNDU2}
jwt.expiration-ms=900000
jwt.refresh-expiration-ms=604800000
jwt.issuer=user-service
jwt.audience=api-gateway

# Server port (Railway injects PORT automatically)
server.port=${PORT:8080}

